name: Docs Pages

on:
  workflow_call:
    inputs:
      docs-base-path:
        required: true
        type: string
      site-slug:
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: "24"
      pnpm-version:
        required: false
        type: string
        default: "11.4.0"
      build-command:
        required: false
        type: string
        default: "pnpm docs:build"
      docs-app-path:
        required: false
        type: string
        default: "apps/docs"
      artifact-path:
        required: false
        type: string
        default: "apps/docs/dist"
      prepare-command:
        required: false
        type: string
        default: ""
      publish-repository:
        required: false
        type: string
        default: "Volpestyle/docs"
      publish-branch:
        required: false
        type: string
        default: "gh-pages"
    secrets:
      docs-publish-key:
        required: true

permissions:
  contents: read

concurrency:
  group: "docs-pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v6

      - name: Checkout shared docs framework
        run: git clone --depth 1 https://github.com/Volpestyle/docs.git ../docs

      - name: Check docs source input guardrails
        run: node ../docs/scripts/guard-docs-inputs.mjs . "${{ inputs.docs-app-path }}"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ inputs.pnpm-version }} --activate

      - name: Prepare local file dependencies
        if: inputs.prepare-command != ''
        run: ${{ inputs.prepare-command }}

      - name: Configure docs publish SSH key
        if: github.event_name != 'pull_request'
        env:
          DOCS_PUBLISH_KEY: ${{ secrets.docs-publish-key }}
        run: |
          set -euo pipefail
          if [ -z "$DOCS_PUBLISH_KEY" ]; then
            echo "DOCS_PUBLISH_KEY is required to publish generated docs into Volpestyle/docs." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DOCS_PUBLISH_KEY" > ~/.ssh/docs_publish_key
          chmod 600 ~/.ssh/docs_publish_key
          curl -fsSL https://api.github.com/meta | node -e '
            let body = "";
            process.stdin.on("data", (chunk) => (body += chunk));
            process.stdin.on("end", () => {
              for (const key of JSON.parse(body).ssh_keys) {
                console.log(`github.com ${key}`);
              }
            });
          ' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install shared docs dependencies
        run: pnpm --dir ../docs install --frozen-lockfile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: ${{ inputs.build-command }}
        env:
          DOCS_BASE_PATH: ${{ inputs.docs-base-path }}

      - name: Check public docs artifact guardrails
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
          SITE_SLUG: ${{ inputs.site-slug }}
        run: node ../docs/scripts/guard-pages-artifact.mjs "$ARTIFACT_PATH" "$SITE_SLUG"

      - name: Publish to shared docs host
        if: github.event_name != 'pull_request'
        env:
          PUBLISH_REPOSITORY: ${{ inputs.publish-repository }}
          PUBLISH_BRANCH: ${{ inputs.publish-branch }}
          SITE_SLUG: ${{ inputs.site-slug }}
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/docs_publish_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          set -euo pipefail

          case "$SITE_SLUG" in
            ""|.*|*..*|*/*)
              echo "Invalid site-slug: $SITE_SLUG" >&2
              exit 1
              ;;
          esac

          publish_dir="$RUNNER_TEMP/docs-pages-publish"
          remote_url="git@github.com:${PUBLISH_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$remote_url" "$PUBLISH_BRANCH" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$PUBLISH_BRANCH" "$remote_url" "$publish_dir"
          else
            mkdir -p "$publish_dir"
            git -C "$publish_dir" init
            git -C "$publish_dir" checkout --orphan "$PUBLISH_BRANCH"
          fi

          if ! git -C "$publish_dir" remote get-url origin >/dev/null 2>&1; then
            git -C "$publish_dir" remote add origin "$remote_url"
          fi

          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf "$publish_dir/$SITE_SLUG"
          mkdir -p "$publish_dir/$SITE_SLUG"
          cp -a "$ARTIFACT_PATH"/. "$publish_dir/$SITE_SLUG"/
          touch "$publish_dir/.nojekyll"
          node ../docs/scripts/update-pages-index.mjs "$publish_dir"

          git -C "$publish_dir" add --all
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "No docs changes to publish."
            exit 0
          fi

          git -C "$publish_dir" commit -m "Publish ${SITE_SLUG} docs from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          for attempt in 1 2 3; do
            if git -C "$publish_dir" push origin "HEAD:$PUBLISH_BRANCH"; then
              exit 0
            fi
            git -C "$publish_dir" pull --rebase origin "$PUBLISH_BRANCH"
          done

          echo "Failed to publish docs after 3 attempts." >&2
          exit 1
